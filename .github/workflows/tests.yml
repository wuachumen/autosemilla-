name: AutoSemilla tests
on:
  push:
    branches: ["main", "feature/**", "consolidated/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke — all benchmarks
        run: |
          python -m autosemilla.cli --benchmark invsqrt --n 12 --db /tmp/a.sqlite --export /tmp/a.jsonl
          python -m autosemilla.cli --benchmark dqi --n 12 --db /tmp/a.sqlite --export /tmp/a.jsonl
          python -m autosemilla.cli --benchmark dfthcsos --n 12 --db /tmp/a.sqlite --export /tmp/a.jsonl
